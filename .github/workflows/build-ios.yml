name: Build iOS IPA

on:
  push:
    branches:
      - feature/react-native-expo
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍏 Compilar Synapse.ipa (macOS Runner)
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: 🍏 Compilar con Xcode (Unsigned para Sideloadly)
        run: |
          cd ios
          xcodebuild -workspace Synapse.xcworkspace \
            -scheme Synapse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build

      - name: 📦 Empaquetar archivo Synapse.ipa
        run: |
          mkdir -p build_output/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Synapse.app build_output/Payload/
          cd build_output
          zip -qr ../Synapse.ipa Payload
          cd ..
          ls -la Synapse.ipa

      - name: 🚀 Subir Synapse.ipa a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-IPA
          path: Synapse.ipa
          retention-days: 14
