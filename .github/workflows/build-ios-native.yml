name: Build Native iOS App (React Native / Expo)

on:
  push:
    branches:
      - feature/react-native-expo
      - main
  workflow_dispatch:

jobs:
  build-ios-native:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Native iOS App
        working-directory: ios
        run: |
          xcodebuild -workspace Synapse.xcworkspace \
            -scheme Synapse \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Synapse.app" -type d | head -n 1)
          fi
          echo "Found app at $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r Synapse-Native-Release.ipa Payload

      - name: Upload Native iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-Native-iOS-Release
          path: build/Synapse-Native-Release.ipa
          retention-days: 7
